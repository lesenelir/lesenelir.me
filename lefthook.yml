# https://lefthook.dev/configuration/
pre-commit:
  jobs:
    - name: biome check
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: go fmt and vet (kit)
      root: apps/kit/
      glob: "*.go"
      run: gofmt -l -w {staged_files} && go vet ./...
      stage_fixed: true
